- tactic: discovery
  technique_name: System Information Discovery
  technique_id: T1082
  name: RG-AE-001 / 02 / System Information Discovery
  description: Authorized, non-destructive host survey for RG-AE-001. Queries Windows
    operating system details, hostname, version, build, architecture, and last boot
    time. Returns structured output to Caldera. No files, registry settings, services,
    accounts, or network configuration are modified.
  executors:
  - name: psh
    platform: windows
    command: "Get-CimInstance Win32_OperatingSystem |\n    Select-Object CSName, Caption,\
      \ Version, BuildNumber, OSArchitecture, LastBootUpTime |\n    ConvertTo-Json\
      \ -Compress"
