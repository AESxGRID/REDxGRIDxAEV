- tactic: command-and-control
  technique_name: Ingress Tool Transfer
  technique_id: T1105
  name: RG-AE-001 / 05 / Benign Staging Transfer
  description: Authorized T1105 staging simulation for RG-AE-001. Downloads a non-executable
    text marker from the ATHENA-OS lab web server into the dedicated campaign staging
    directory, then returns the local path, size, and SHA-256 hash. No executable
    payload, credential material, persistence mechanism, or external data transfer
    is involved.
  executors:
  - name: psh
    platform: windows
    command: $destination='C:\ProgramData\RG-AE-001\stage\rg-ae-001-stage.txt';New-Item
      -Path (Split-Path -Parent $destination) -ItemType Directory -Force | Out-Null;Invoke-WebRequest
      -Uri 'http://staging-server.example.invalid/rg-ae-001-stage.txt' -OutFile $destination -UseBasicParsing;[PSCustomObject]@{Campaign='RG-AE-001';Step='05';Technique='T1105';Path=$destination;SHA256=(Get-FileHash
      -Path $destination -Algorithm SHA256).Hash;Bytes=(Get-Item $destination).Length}
      | ConvertTo-Json -Compress
    code: null
    language: null
    build_target: null
    payloads: []
    uploads: []
    timeout: 60
    parsers: []
    cleanup:
    - Remove-Item 'C:\ProgramData\RG-AE-001\stage\rg-ae-001-stage.txt' -Force -ErrorAction
      SilentlyContinue
    variations: []
    additional_info: {}
  requirements: []
  privilege: ''
  repeatable: false
  buckets:
  - command-and-control
  additional_info: {}
  access: {}
  singleton: false
  plugin: ''
  delete_payload: true
